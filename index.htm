<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Triangle Pattern Game</title>

<!-- iOS web app meta tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triangle Pattern Game">

<!-- Icons -->
<link rel="icon" type="image/png" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">

<style>
  body {
    background: #1a1a1a;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 0;
    padding: 0;
    touch-action: none;
  }
  h1 { margin-top: 15px; }
  #controls { margin: 15px; }
  button, select {
    margin: 0 8px;
    padding: 10px 18px;
    font-size: 16px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    cursor: pointer;
    box-shadow: 0 3px 5px rgba(0,0,0,0.4);
    transition: background 0.2s, transform 0.1s;
  }
  button:hover, select:hover {
    background: #555;
    transform: translateY(-2px);
  }
  button:active {
    background: #222;
    transform: translateY(0);
  }
  #palettePreview div:hover {
    border-color: white;
  }
  canvas {
    display: block;
    margin: 0 auto 20px;
    background: black;
    cursor: pointer;
    touch-action: none;
  }
</style>
</head>
<body>
<h1>Triangle Pattern Game</h1>

<div id="controls">
  <select id="colorScheme"></select>
  <button id="undo">Undo</button>
  <button id="reset">Reset</button>
  <button id="reshuffle">Randomize</button>
  <select id="rotateScheme">
    <option value="0">Rotate: Off</option>
    <option value="10">Rotate: 10s</option>
    <option value="20">Rotate: 20s</option>
    <option value="40">Rotate: 40s</option>
    <option value="60">Rotate: 60s</option>
  </select>
  <div id="palettePreview" style="display:inline-block; margin-left:20px; vertical-align:middle;"></div>
</div>

<canvas id="canvas" width="1200" height="800"></canvas>

<script>
const SIDE = 40;
const WIDTH = Math.round(Math.sqrt(3)/2*SIDE);

// ================= Palettes =================
const COLOR_SCHEMES_BY_CATEGORY = {
  "Cool": {
    "Ocean": ["#003264","#004b96","#0064c8","#3296ff","#64c8ff"],
    "Cosmic Space": ["#0d1b2a","#1b263b","#415a77","#778da9","#e0e1dd"],
    "Sunny Woods": ["#1b4d3e","#2e8b57","#66cdaa","#fff176","#87cefa"],
    "Satin Linen": ["#e2e4d1","#d82b62","#243e0a","#a9bee9","#525f5e"]
  },
  "Warm": {
    "Ocean Blues": ["#003f5c","#2f4b7c","#665191","#a05195","#d45087"],
    "Sunset Glow": ["#ff6e54","#ffa600","#ff7c43","#f95d6a","#d45087"],
    "Cherry Reds": ["#ff0000","#ff4d4d","#ff6666","#ff9999","#ffcccc"],
    "Rose Garden": ["#b11226","#d63447","#e68a8a","#f2b5b5","#ffe5e5"],
    "Berry Mix": ["#9b111e","#c72c48","#e7546b","#f78fa7","#ffc0cb"],
    "Evening": ["#364f84","#4e632a","#90321f","#fac625","#6a5222"],
    "Golden Sunset": ["#ffd700","#ff9a00","#ff4500","#ff2d55","#ff85a2"]
  },
  "Pastel / Soft": {
    "Candy Pastels": ["#ffadad","#ffd6a5","#fdffb6","#caffbf","#9bf6ff"],
    "Flaming Rose": ["#fff176","#ffc107","#ff6f61","#ff4081","#ffb6c1"],
    "5 Greys": ["#111111","#333333","#555555","#777777","#999999"]
  },
  "Vivid": {
    "Sunrise": ["#ffbe0b","#fb5607","#ff006e","#8338ec","#3a86ff"],
    "Rainbow": ["#E40303","#FF8C00","#FFED00","#008026","#004DFF","#750787"]
  },
  "Earthy / Brown": {
    "Warm Browns": ["#4b2e2e","#704040","#a65d4d","#c48b7f","#e6cfc0"],
    "Chocolate": ["#3b1f1f","#5c3a3a","#7d5656","#a07c7c","#c4a3a3"],
    "Sandstone": ["#7b5e57","#a1796b","#c59b8f","#d9bfb5","#efdfda"],
    "Desert Dawn": ["#fff59d","#ffd54f","#ffb74d","#a97448","#7b5e4f"],
    "Desert Sunset": ["#fff59d","#ffd54f","#ff8c42","#e63946","#a63c28"],
    "Autumn Hues": ["#fff176","#ffeb3b","#fbc02d","#a1887f","#6d4c41"]
  },
  "Forest": {
    "Forest Greens": ["#2a9d8f","#264653","#e9c46a","#f4a261"],
    "Forest Morning": ["#2a7f5e","#a3d977","#ffe066","#87ceeb"],
    "Autumn Forest": ["#4b773c","#d4e157","#ffc107","#81d4fa"],
    "Forest Twilight": ["#2a7f5e","#a3d977","#ffe066","#264653"],
    "Bright Woods": ["#1b4d3e","#2e8b57","#66cdaa","#fff176"],
    "Morning Forest": ["#4b773c","#88b04b","#d4e157","#ffc107"]
  }
};

const COLOR_SCHEMES={};
Object.values(COLOR_SCHEMES_BY_CATEGORY).forEach(cat=>{
  Object.entries(cat).forEach(([name,colors])=>{
    COLOR_SCHEMES[name]=colors;
  });
});

let currentColorScheme = Object.keys(COLOR_SCHEMES)[0];
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const rows = Math.floor(canvas.height/(SIDE/2));
const cols = Math.floor(canvas.width/WIDTH);

let triangles=[],originalColors=[],undoStack=[],redoStack=[],hoverIndex=-1;

// Drag state
let isDragging=false,dragAffectedTriangles=new Set(),dragChanges=[],mouseDownPos=null,justFinishedDrag=false;

// Rotation
let rotateIntervalId=null;
const rotateSelect=document.getElementById("rotateScheme");
const colorSchemeNames=Object.keys(COLOR_SCHEMES);
let rotateIndex=colorSchemeNames.indexOf(currentColorScheme);

rotateSelect.onchange=()=>{
  const sec=parseInt(rotateSelect.value,10);
  if(rotateIntervalId){clearInterval(rotateIntervalId); rotateIntervalId=null;}
  if(sec>0){
    rotateIntervalId=setInterval(()=>{
      rotateIndex=(rotateIndex+1)%colorSchemeNames.length;
      const next=colorSchemeNames[rotateIndex];
      document.getElementById("colorScheme").value=next;
      applyColorScheme(next);
    },sec*1000);
  }
};

// ================= Helpers =================
function getCurrentColors(){ return COLOR_SCHEMES[currentColorScheme]; }
function hexToRgb(hex){ return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }
function rgbToHex(r,g,b){ return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

// ================= Grid =================
function initGrid(){
  triangles=[];
  for(let row=0;row<rows;row++){
    const y=row*(SIDE/2);
    const xShift=row%2===0?0:WIDTH;
    for(let col=0;col<cols;col++){
      const x=col*WIDTH+xShift;
      const right=col%2===0;
      if((right&&x==0)||(!right&&x+WIDTH>canvas.width)) continue; // skip partial left/right

      const points=right?[[x,y],[x,y+SIDE],[x+WIDTH,y+SIDE/2]]:[[x+WIDTH,y],[x+WIDTH,y+SIDE],[x,y+SIDE/2]];
      const ci=Math.floor(Math.random()*getCurrentColors().length);
      const rgb=hexToRgb(getCurrentColors()[ci]);
      triangles.push({points,colorIndex:ci,currentColor:[...rgb],targetColor:[...rgb],animStart:0});
    }
  }
  originalColors=triangles.map(t=>t.colorIndex);
}

// ================= Drawing =================
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const now=performance.now();
  triangles.forEach((t,i)=>{
    const p=Math.min((now-t.animStart)/200,1);
    t.currentColor=t.currentColor.map((c,j)=>Math.round(c+(t.targetColor[j]-c)*p));
    ctx.fillStyle=rgbToHex(...t.currentColor);
    ctx.beginPath();
    ctx.moveTo(...t.points[0]);
    ctx.lineTo(...t.points[1]);
    ctx.lineTo(...t.points[2]);
    ctx.closePath();
    ctx.fill();
    if(i===hoverIndex){
      ctx.strokeStyle="rgba(255,255,255,0.5)";
      ctx.lineWidth=2;
      ctx.stroke();
    }
  });
}

// ================= Geometry =================
function pointInTriangle(px,py,tri){
  const [a,b,c]=tri;
  const area=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);
  const s=((b[1]-c[1])*(px-c[0])+(c[0]-b[0])*(py-c[1]))/area;
  const t=((c[1]-a[1])*(px-c[0])+(a[0]-c[0])*(py-c[1]))/area;
  return s>=-0.01 && t>=-0.01 && s+t<=1.01;
}

// ================= Undo =================
function setTriangleColor(index,newColor){
  const t=triangles[index];
  const oldColor=t.colorIndex;
  if(oldColor===newColor) return null;
  t.colorIndex=newColor;
  t.animStart=performance.now();
  t.targetColor=hexToRgb(getCurrentColors()[newColor]);
  return {index,oldColor,newColor};
}
function saveBatchDiff(changes){ if(changes.length){undoStack.push(changes);redoStack.length=0;} }
function applyDiff(diff,forward){ diff.forEach(d=>setTriangleColor(d.index,forward?d.newColor:d.oldColor)); }

// ================= Drag shuffle =================
function shuffleTriangleUnderPointer(mx,my){
  for(let i=0;i<triangles.length;i++){
    if(pointInTriangle(mx,my,triangles[i].points)){
      const newColor=Math.floor(Math.random()*getCurrentColors().length);
      const change=setTriangleColor(i,newColor);
      if(!change) return;
      if(!dragAffectedTriangles.has(i)){
        dragAffectedTriangles.add(i);
        dragChanges.push(change);
      } else {
        const existing=dragChanges.find(c=>c.index===i);
        if(existing) existing.newColor=newColor;
      }
      return;
    }
  }
}

// ================= Actions =================
function undoAction(){ if(!undoStack.length) return; const diff=undoStack.pop(); applyDiff(diff,false); redoStack.push(diff);}
function resetAction(){ triangles.forEach((_,i)=>setTriangleColor(i,originalColors[i])); undoStack.length=redoStack.length=0;}
function reshuffleAction(){ triangles.forEach((_,i)=>setTriangleColor(i,Math.floor(Math.random()*getCurrentColors().length))); originalColors=triangles.map(t=>t.colorIndex); undoStack.length=redoStack.length=0;}

// ================= Color Scheme =================
function applyColorScheme(scheme){ currentColorScheme=scheme; initGrid(); undoStack.length=redoStack.length=0; renderPalette(); }

// ================= Palette =================
function renderPalette(){
  const container=document.getElementById("palettePreview");
  container.innerHTML="";
  const colors=getCurrentColors();
  colors.forEach((color,index)=>{
    const square=document.createElement("div");
    square.style.display="inline-block";
    square.style.width=WIDTH+"px";
    square.style.height=SIDE+"px";
    square.style.backgroundColor=color;
    square.style.marginRight="2px";
    square.style.border="1px solid #555";
    square.style.cursor="pointer";
    square.onclick=()=>{
      const changes=[];
      triangles.forEach((_,i)=>{
        const c=setTriangleColor(i,index);
        if(c) changes.push(c);
      });
      saveBatchDiff(changes);
    };
    container.appendChild(square);
  });
}

// ================= Events =================
// Mouse
canvas.addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  const r=canvas.getBoundingClientRect();
  mouseDownPos={x:e.clientX-r.left,y:e.clientY-r.top};
});
canvas.addEventListener("mousemove",e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  if(mouseDownPos && !isDragging){
    if(Math.hypot(mx-mouseDownPos.x,my-mouseDownPos.y)>5){
      isDragging=true;
      dragAffectedTriangles.clear();
      dragChanges=[];
      shuffleTriangleUnderPointer(mx,my);
    }
  }
  if(isDragging) shuffleTriangleUnderPointer(mx,my);
  else hoverIndex=triangles.findIndex(t=>pointInTriangle(mx,my,t.points));
});
canvas.addEventListener("mouseup",()=>{
  if(isDragging){
    isDragging=false;
    justFinishedDrag=true;
    saveBatchDiff([...dragChanges]);
    dragAffectedTriangles.clear();
    dragChanges=[];
    setTimeout(()=>justFinishedDrag=false,0);
  }
  mouseDownPos=null;
});
canvas.addEventListener("click",()=>{
  if(justFinishedDrag) return;
  if(hoverIndex>=0){
    const t=triangles[hoverIndex];
    const next=(t.colorIndex+1)%getCurrentColors().length;
    saveBatchDiff([setTriangleColor(hoverIndex,next)]);
  }
});

// Touch
canvas.addEventListener("touchstart", e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const mx=t.clientX-r.left,my=t.clientY-r.top;
  mouseDownPos={x:mx,y:my};
  isDragging=true;
  dragAffectedTriangles.clear();
  dragChanges=[];
  shuffleTriangleUnderPointer(mx,my);
});
canvas.addEventListener("touchmove", e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  const t=e.touches[0];
  const mx=t.clientX-r.left,my=t.clientY-r.top;
  if(isDragging) shuffleTriangleUnderPointer(mx,my);
});
canvas.addEventListener("touchend", e=>{
  e.preventDefault();
  if(isDragging){
    isDragging=false;
    saveBatchDiff([...dragChanges]);
    dragAffectedTriangles.clear();
    dragChanges=[];
  }
  mouseDownPos=null;
});

// ================= UI wiring =================
document.getElementById("undo").onclick=undoAction;
document.getElementById("reset").onclick=resetAction;
document.getElementById("reshuffle").onclick=reshuffleAction;
document.getElementById("colorScheme").onchange=e=>applyColorScheme(e.target.value);

// ================= Init =================
function populateColorSchemes(){
  const sel=document.getElementById("colorScheme");
  sel.innerHTML="";
  Object.entries(COLOR_SCHEMES_BY_CATEGORY).forEach(([category,palettes])=>{
    const optgroup=document.createElement("optgroup");
    optgroup.label=category;
    Object.keys(palettes).forEach(name=>{
      const option=document.createElement("option");
      option.value=name;
      option.textContent=name;
      optgroup.appendChild(option);
    });
    sel.appendChild(optgroup);
  });
}
function loop(){ draw(); requestAnimationFrame(loop); }

populateColorSchemes();
applyColorScheme(currentColorScheme);
loop();
</script>
</body>
</html>

	"Morning Forest": ["#4b773c", "#88b04b", "#d4e157", "#ffc107"]
  }
};

// Flatten into a single COLOR_SCHEMES object for game logic
const COLOR_SCHEMES = {};
Object.values(COLOR_SCHEMES_BY_CATEGORY).forEach(cat=>{
  Object.entries(cat).forEach(([name,colors])=>{
    COLOR_SCHEMES[name]=colors;
  });
});

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const rows = Math.floor(canvas.height / (SIDE/2));
const cols = Math.floor(canvas.width / WIDTH);

let triangles = [];
let originalColors = [];
let undoStack = [];
let redoStack = [];
let hoverIndex = -1;

/* Drag state */
let isDragging = false;
let dragAffectedTriangles = new Set();
let dragChanges = [];
let mouseDownPos = null;
let justFinishedDrag = false;

/* Rotation feature */
let rotateIntervalId = null;

const rotateSelect = document.getElementById("rotateScheme");
const colorSchemeNames = Object.keys(COLOR_SCHEMES); // Array of all scheme names
let rotateIndex = colorSchemeNames.indexOf(currentColorScheme);

rotateSelect.onchange = () => {
  const seconds = parseInt(rotateSelect.value, 10);
  
  // Clear previous interval
  if (rotateIntervalId) {
    clearInterval(rotateIntervalId);
    rotateIntervalId = null;
  }

  if (seconds > 0) {
    rotateIntervalId = setInterval(() => {
      rotateIndex = (rotateIndex + 1) % colorSchemeNames.length;
      const nextScheme = colorSchemeNames[rotateIndex];
      document.getElementById("colorScheme").value = nextScheme;
      applyColorScheme(nextScheme);
    }, seconds * 1000);
  }
};

// Ensure rotation starts correctly if the first scheme is not the first in the list
rotateIndex = colorSchemeNames.indexOf(currentColorScheme);


/* ===================== Helpers ===================== */
function getCurrentColors() {
  return COLOR_SCHEMES[currentColorScheme];
}

function hexToRgb(hex) {
  return [
    parseInt(hex.slice(1,3),16),
    parseInt(hex.slice(3,5),16),
    parseInt(hex.slice(5,7),16)
  ];
}

function rgbToHex(r,g,b) {
  return "#" + ((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ===================== Grid ===================== */
function initGridTruncated() {
  triangles = [];
  // Only generate full rows/cols
  for (let row = 0; row < rows; row++) {
    const y = row * (SIDE / 2);
    const xShift = (row % 2 === 0) ? 0 : WIDTH;
    for (let col = 1; col < cols - 1; col++) { // skip first and last column
      const direction = (col % 2 === 0) ? 'right' : 'left';
      const x = col * WIDTH + xShift;
      const ci = Math.floor(Math.random() * getCurrentColors().length);
      let points;
      if (direction === 'right') {
        points = [
          [x, y],
          [x, y + SIDE],
          [x + WIDTH, y + SIDE / 2]
        ];
      } else {
        points = [
          [x + WIDTH, y],
          [x + WIDTH, y + SIDE],
          [x, y + SIDE / 2]
        ];
      }
      const color = getCurrentColors()[ci];
      triangles.push({
        points,
        colorIndex: ci,
        currentColor: hexToRgb(color),
        targetColor: hexToRgb(color),
        animStart: 0
      });
    }
  }
  originalColors = triangles.map(t => t.colorIndex);
}

function initGrid() {
  triangles = [];
  for (let row=0; row<rows; row++) {
    const y = row*(SIDE/2);
    const xShift = row%2 === 0 ? 0 : WIDTH;
    for (let col=0; col<cols; col++) {
      const x = col*WIDTH + xShift;
      const right = col%2 === 0;
      const points = right
        ? [[x,y],[x,y+SIDE],[x+WIDTH,y+SIDE/2]]
        : [[x+WIDTH,y],[x+WIDTH,y+SIDE],[x,y+SIDE/2]];

      const ci = Math.floor(Math.random() * getCurrentColors().length);
      const rgb = hexToRgb(getCurrentColors()[ci]);

      // hack to skip partial rectangles at left and right
      if ((right && x == 0) || (!right && x + WIDTH > canvas.width)) {
	    continue;
	  }
      triangles.push({
        points,
        colorIndex: ci,
        currentColor: [...rgb],
        targetColor: [...rgb],
        animStart: 0
      });
    }
  }
  originalColors = triangles.map(t=>t.colorIndex);
}

/* ===================== Drawing ===================== */
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const now = performance.now();
  triangles.forEach((t,i)=>{
	const p = Math.min((now - t.animStart)/200,1);
	t.currentColor = t.currentColor.map((c,j)=>Math.round(c + (t.targetColor[j]-c)*p));

	ctx.fillStyle = rgbToHex(...t.currentColor);
	ctx.beginPath();
	ctx.moveTo(...t.points[0]);
	ctx.lineTo(...t.points[1]);
	ctx.lineTo(...t.points[2]);
	ctx.closePath();
	ctx.fill();

	if(i===hoverIndex){
	  ctx.strokeStyle="rgba(255,255,255,0.5)";
	  ctx.lineWidth=2;
	  ctx.stroke();
	}
  });
}

/* ===================== Geometry ===================== */
function pointInTriangle(px, py, tri){
  const [a,b,c]=tri;
  const area=(b[1]-c[1])*(a[0]-c[0])+(c[0]-b[0])*(a[1]-c[1]);
  const s=((b[1]-c[1])*(px-c[0])+(c[0]-b[0])*(py-c[1]))/area;
  const t=((c[1]-a[1])*(px-c[0])+(a[0]-c[0])*(py-c[1]))/area;
  return s>=-0.01 && t>=-0.01 && s+t<=1.01;
}

/* ===================== Undo helpers ===================== */
function setTriangleColor(index,newColor){
  const t=triangles[index];
  const oldColor=t.colorIndex;
  if(oldColor===newColor) return null;
  t.colorIndex=newColor;
  t.animStart=performance.now();
  t.targetColor=hexToRgb(getCurrentColors()[newColor]);
  return {index,oldColor,newColor};
}

function saveBatchDiff(changes){
  if(changes.length){
    undoStack.push(changes);
    redoStack.length=0;
  }
}

function applyDiff(diff,forward){
  diff.forEach(d=>setTriangleColor(d.index, forward?d.newColor:d.oldColor));
}

/* ===================== Drag shuffle ===================== */
function shuffleTriangleUnderPointer(mx,my){
  for(let i=0;i<triangles.length;i++){
    if(pointInTriangle(mx,my,triangles[i].points)){
      const newColor=Math.floor(Math.random()*getCurrentColors().length);
      const change=setTriangleColor(i,newColor);
      if(!change) return;
      if(!dragAffectedTriangles.has(i)){
        dragAffectedTriangles.add(i);
        dragChanges.push(change);
      } else {
        const existing = dragChanges.find(c=>c.index===i);
        if(existing) existing.newColor = newColor;
      }
      return;
    }
  }
}

/* ===================== Actions ===================== */
function undoAction(){ if(!undoStack.length) return; const diff=undoStack.pop(); applyDiff(diff,false); redoStack.push(diff); }
function resetAction(){ triangles.forEach((_,i)=>setTriangleColor(i,originalColors[i])); undoStack.length=redoStack.length=0; }
function reshuffleAction(){ triangles.forEach((_,i)=>setTriangleColor(i,Math.floor(Math.random()*getCurrentColors().length))); originalColors=triangles.map(t=>t.colorIndex); undoStack.length=redoStack.length=0; }

/* ===================== Color scheme ===================== */
function applyColorScheme(scheme){
  currentColorScheme=scheme;
  initGrid();
  undoStack.length=redoStack.length=0;
  renderPalette();
}

/* ===================== Palette ===================== */
function renderPalette(){
  const container=document.getElementById("palettePreview");
  container.innerHTML="";
  const colors=getCurrentColors();
  colors.forEach((color,index)=>{
    const square=document.createElement("div");
    square.style.display="inline-block";
    square.style.width=WIDTH+"px";
    square.style.height=SIDE+"px";
    square.style.backgroundColor=color;
    square.style.marginRight="2px";
    square.style.border="1px solid #555";
    square.style.cursor="pointer";
    square.onclick=()=>{
      const changes=[];
      triangles.forEach((_,i)=>{
        const c=setTriangleColor(i,index);
        if(c) changes.push(c);
      });
      saveBatchDiff(changes);
    };
    container.appendChild(square);
  });
}

/* ===================== Events ===================== */
canvas.addEventListener("mousedown",e=>{
  if(e.button!==0) return;
  const r=canvas.getBoundingClientRect();
  mouseDownPos={x:e.clientX-r.left,y:e.clientY-r.top};
});

canvas.addEventListener("mousemove",e=>{
  const r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  if(mouseDownPos && !isDragging){
    if(Math.hypot(mx-mouseDownPos.x,my-mouseDownPos.y)>5){
      isDragging=true;
      dragAffectedTriangles.clear();
      dragChanges=[];
      shuffleTriangleUnderPointer(mx,my);
    }
  }
  if(isDragging) shuffleTriangleUnderPointer(mx,my);
  else hoverIndex=triangles.findIndex(t=>pointInTriangle(mx,my,t.points));
});

canvas.addEventListener("mouseup",()=>{
  if(isDragging){
    isDragging=false;
    justFinishedDrag=true;
    saveBatchDiff([...dragChanges]);
    dragAffectedTriangles.clear();
    dragChanges=[];
    setTimeout(()=>justFinishedDrag=false,0);
  }
  mouseDownPos=null;
});

canvas.addEventListener("click",()=>{
  if(justFinishedDrag) return;
  if(hoverIndex>=0){
    const t=triangles[hoverIndex];
    const next=(t.colorIndex+1)%getCurrentColors().length;
    saveBatchDiff([setTriangleColor(hoverIndex,next)]);
  }
});

/* ===================== UI wiring ===================== */
document.getElementById("undo").onclick=undoAction;
document.getElementById("reset").onclick=resetAction;
document.getElementById("reshuffle").onclick=reshuffleAction;
document.getElementById("colorScheme").onchange=e=>applyColorScheme(e.target.value);

/* ===================== Init ===================== */

// Populate <select> with categories and palettes
function populateColorSchemes(){
  const sel=document.getElementById("colorScheme");
  sel.innerHTML="";
  Object.entries(COLOR_SCHEMES_BY_CATEGORY).forEach(([category,palettes])=>{
    const optgroup = document.createElement("optgroup");
    optgroup.label = category;
    Object.keys(palettes).forEach(name=>{
      const option = document.createElement("option");
      option.value = name;
      option.textContent = name;
      optgroup.appendChild(option);
    });
    sel.appendChild(optgroup);
  });
}

function loop(){ draw(); requestAnimationFrame(loop); }

populateColorSchemes();
applyColorScheme(currentColorScheme);
loop();
</script>
</body>
